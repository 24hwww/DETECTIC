[package]
name = "wss_probe"
version = "0.1.0"
edition = "2021"

[dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2.5"
serde_json = "1"

[profile.release]
opt-level = "z"
strip = true
