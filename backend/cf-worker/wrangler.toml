# ============================================================================
# Detectic Backend — Cloudflare Worker Configuration
# ============================================================================
# Deploy: npx wrangler deploy
# ============================================================================

name = "detectic"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "detectic-db"
# database_id is set via `npx wrangler d1 create detectic-db`
# and then pasted here after the command outputs it.
# Example: database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
database_id = "30f6af13-7a79-4203-9c7e-4c14b06e47c6"

# Durable Object realtime hub
[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RealtimeHub"]

# Static assets built from the shadcn/React frontend (frontend/detectic-ui).
# `run_worker_first = true` lets index.ts serve API/WSS routes and fall back
# to the asset binding for everything else (e.g. /, /assets/*, /favicon.svg).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1


# Environment variables (set via: npx wrangler secret put DETECTIC_SENSORS)
# DETECTIC_SENSORS = '{"ex520-001": "your-sensor-secret"}'
# DETECTIC_MASTER_SECRET = 'your-master-secret'
# DETECTIC_ALLOWED_ORIGINS = 'https://detectic.24hwww.workers.dev'  (optional)

# Free tier: 100K req/day, 10 ms CPU/req
# Paid ($5/mo): 10M req/day, 30 ms CPU/req
