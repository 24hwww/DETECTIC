<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detectic — EX520 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid #21262d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:18px;font-weight:600;color:#58a6ff}
.header .status{display:flex;gap:16px;align-items:center;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.dot.on{background:#3fb950;box-shadow:0 0 6px #3fb950}
.dot.off{background:#f85149;box-shadow:0 0 6px #f85149}
.dot.warn{background:#d29922;box-shadow:0 0 6px #d29922}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:20px 24px}
.card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:20px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#58a6ff,#3fb950)}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#8b949e;margin-bottom:12px}
.card .big{font-size:32px;font-weight:700;color:#f0f6fc}
.card .sub{font-size:12px;color:#8b949e;margin-top:4px}
.chart-card{grid-column:1/-1;background:#161b22;border:1px solid #21262d;border-radius:12px;padding:20px}
.chart-card h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#8b949e;margin-bottom:12px}
.chart-wrap{position:relative;height:260px}
.devices{grid-column:1/-1}
.device-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.device{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;transition:border-color .2s}
.device:hover{border-color:#58a6ff}
.device .icon{width:36px;height:36px;border-radius:8px;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.device .info{flex:1;min-width:0}
.device .name{font-size:13px;font-weight:600;color:#f0f6fc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.device .meta{font-size:11px;color:#8b949e;margin-top:2px}
.device .rssi{font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;flex-shrink:0}
.rssi-strong{background:#238636;color:#3fb950}
.rssi-medium{background:#9e6a03;color:#d29922}
.rssi-weak{background:#6e2b2b;color:#f85149}
.empty{text-align:center;padding:40px;color:#484f58;font-size:14px}
.refresh-bar{position:fixed;bottom:0;left:0;right:0;height:3px;background:#21262d;z-index:10}
.refresh-bar .fill{height:100%;background:linear-gradient(90deg,#58a6ff,#3fb950);transition:width .3s;width:0}
@media(max-width:640px){.grid{padding:12px}.card{padding:16px}.card .big{font-size:24px}}
</style>
</head>
<body>

<div class="header">
  <h1>📡 Detectic — EX520</h1>
  <div class="status">
    <span><span class="dot on" id="statusDot"></span><span id="statusText">connecting…</span></span>
    <span id="lastUpdate" style="color:#484f58">—</span>
  </div>
</div>

<div class="grid">
  <!-- Stats cards -->
  <div class="card">
    <h3>Devices Seen</h3>
    <div class="big" id="statDevices">—</div>
    <div class="sub" id="statDevicesSub"></div>
  </div>
  <div class="card">
    <h3>Total Snapshots</h3>
    <div class="big" id="statSnapshots">—</div>
    <div class="sub" id="statSnapshotsSub"></div>
  </div>
  <div class="card">
    <h3>Sensor Status</h3>
    <div class="big" id="statSensor" style="font-size:20px">—</div>
    <div class="sub" id="statSensorSub"></div>
  </div>
  <div class="card">
    <h3>Avg RSSI</h3>
    <div class="big" id="statRssi">—</div>
    <div class="sub">signal strength (dBm)</div>
  </div>

  <!-- RSSI Timeline chart -->
  <div class="chart-card">
    <h3>📶 RSSI Timeline (last 24h)</h3>
    <div class="chart-wrap"><canvas id="rssiChart"></canvas></div>
  </div>

  <!-- Device count chart -->
  <div class="chart-card">
    <h3>📊 Device Activity (last 24h)</h3>
    <div class="chart-wrap"><canvas id="activityChart"></canvas></div>
  </div>

  <!-- Device list -->
  <div class="chart-card devices">
    <h3>📱 Active Devices</h3>
    <div class="device-list" id="deviceList">
      <div class="empty">Loading…</div>
    </div>
  </div>
</div>

<div class="refresh-bar"><div class="fill" id="refreshBar"></div></div>

<script>
const API = location.origin + '/api/v1';
const POLL = 15000; // 15s refresh
let rssiChart, activityChart;
const rssiHistory = {};  // pseudonym → [{t, rssi}]
const activityBuckets = {};  // hour → count

// --- Charts ---
function initCharts() {
  const opts = (yLabel, yMin, yMax) => ({
    responsive: true, maintainAspectRatio: false,
    animation: { duration: 400 },
    plugins: { legend: { display: true, labels: { color: '#8b949e', font: { size: 11 } } } },
    scales: {
      x: { type: 'linear', ticks: { color: '#484f58', callback: v => new Date(v*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}), maxTicksLimit: 12 }, grid: { color: '#21262d' } },
      y: { title: { display: true, text: yLabel, color: '#8b949e' }, min: yMin, max: yMax, ticks: { color: '#484f58' }, grid: { color: '#21262d' } }
    }
  });
  rssiChart = new Chart(document.getElementById('rssiChart'), {
    type: 'scatter', data: { datasets: [] },
    options: opts('RSSI (dBm)', -90, -20)
  });
  activityChart = new Chart(document.getElementById('activityChart'), {
    type: 'bar', data: { labels: [], datasets: [{ label: 'Devices', data: [], backgroundColor: '#58a6ff44', borderColor: '#58a6ff', borderWidth: 1 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#484f58', maxTicksLimit: 12 }, grid: { display: false } },
        y: { title: { display: true, text: 'Devices', color: '#8b949e' }, ticks: { color: '#484f58', stepSize: 1 }, grid: { color: '#21262d' }, beginAtZero: true }
      }
    }
  });
}

const COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#79c0ff','#56d364','#e3b341','#ff7b72','#d2a8ff'];

function updateRssiChartFromTimeline(points) {
  // Group by pseudonym
  const byDevice = {};
  points.forEach(p => {
    if (p.rssi == null || !p.pseudonym) return;
    if (!byDevice[p.pseudonym]) byDevice[p.pseudonym] = [];
    byDevice[p.pseudonym].push({ t: p.ts, rssi: p.rssi });
  });
  rssiChart.data.datasets = Object.entries(byDevice).slice(0, 10).map(([pseudo, pts], i) => ({
    label: pseudo.slice(0, 12),
    data: pts.map(p => ({ x: p.t, y: p.rssi })),
    backgroundColor: COLORS[i % COLORS.length],
    borderColor: COLORS[i % COLORS.length],
    pointRadius: 2, pointHoverRadius: 4, borderWidth: 1, showLine: true, fill: false, tension: 0.3
  }));
  rssiChart.update('none');
}

function updateActivityChartFromTimeline(points) {
  // Group by 10-minute buckets
  const buckets = {};
  points.forEach(p => {
    if (!p.ts) return;
    const bucket = Math.floor(p.ts / 600) * 600; // 10 min
    buckets[bucket] = (buckets[bucket] || 0) + 1;
  });
  const sorted = Object.entries(buckets).sort((a,b) => a[0]-b[0]).slice(-24);
  activityChart.data.labels = sorted.map(([ts]) => new Date(ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  activityChart.data.datasets[0].data = sorted.map(([,c]) => c);
  activityChart.update('none');
}

// --- Device list ---
function rssiClass(rssi) {
  if (rssi == null) return 'rssi-weak';
  if (rssi >= -50) return 'rssi-strong';
  if (rssi >= -70) return 'rssi-medium';
  return 'rssi-weak';
}

function renderDevices(devices) {
  const el = document.getElementById('deviceList');
  if (!devices.length) { el.innerHTML = '<div class="empty">No devices detected yet</div>'; return; }
  el.innerHTML = devices.map((d, i) => {
    const initial = (d.pseudonym || '?')[0].toUpperCase();
    const rssi = d.rssi != null ? d.rssi + ' dBm' : '—';
    const ago = d.last_seen ? timeAgo(d.last_seen) : '—';
    const std = d.standard || '—';
    return `<div class="device">
      <div class="icon" style="color:${COLORS[i%COLORS.length]}">${initial}</div>
      <div class="info">
        <div class="name">${esc(d.pseudonym || 'unknown')}</div>
        <div class="meta">${std} · seen ${ago} · ${d.observations || 1} obs</div>
      </div>
      <div class="rssi ${rssiClass(d.rssi)}">${rssi}</div>
    </div>`;
  }).join('');
}

// --- Stats ---
function updateStats(stats, devices, sensors) {
  setText('statDevices', stats.distinct_devices ?? '—');
  setText('statDevicesSub', `${stats.total_detections ?? 0} total detections`);
  setText('statSnapshots', stats.total_snapshots ?? '—');
  setText('statSnapshotsSub', `${stats.snapshots_last_hour ?? 0} in last hour`);

  const sensor = sensors[0];
  if (sensor) {
    setText('statSensor', sensor.id || '—');
    setText('statSensorSub', sensor.last_seen ? `last seen ${timeAgo(sensor.last_seen)}` : '');
  }

  if (devices.length) {
    const avg = Math.round(devices.reduce((s,d) => s + (d.avg_rssi||0), 0) / devices.length);
    setText('statRssi', avg + ' dBm');
  }
}

// --- Fetch & poll ---
async function fetchJSON(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function poll() {
  const bar = document.getElementById('refreshBar');
  bar.style.width = '30%';
  try {
    const [stats, devResp, sensorResp, timeline] = await Promise.all([
      fetchJSON('/stats'),
      fetchJSON('/devices?limit=100'),
      fetchJSON('/sensors'),
      fetchJSON('/timeline?hours=24')
    ]);
    bar.style.width = '70%';
    const devices = devResp.devices || [];
    const sensors = sensorResp.sensors || [];
    const points = timeline.points || [];

    updateStats(stats, devices, sensors);
    renderDevices(devices);
    updateRssiChartFromTimeline(points);
    updateActivityChartFromTimeline(points);

    setStatus('online');
    document.getElementById('lastUpdate').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    setStatus('offline');
    console.error('poll error:', e);
  }
  bar.style.width = '100%';
  setTimeout(() => { bar.style.width = '0%'; }, 300);
}

function setStatus(s) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (s === 'online') { dot.className = 'dot on'; txt.textContent = 'online'; }
  else if (s === 'offline') { dot.className = 'dot off'; txt.textContent = 'offline'; }
  else { dot.className = 'dot warn'; txt.textContent = s; }
}

// --- Helpers ---
function setText(id, v) { document.getElementById(id).textContent = v; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function timeAgo(ts) {
  const diff = Math.floor(Date.now()/1000) - ts;
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

// --- Init ---
initCharts();
poll();
setInterval(poll, POLL);
</script>
</body>
</html>
